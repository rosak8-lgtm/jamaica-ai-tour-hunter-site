name: Verify JAMAICA customer site
on:
  push:
    branches: [main]
    paths-ignore:
      - tour-previews.json
      - 'tour-previews-shards/**'
      - destination-directory.json
  pull_request:
    branches: [main]
    paths-ignore:
      - tour-previews.json
      - 'tour-previews-shards/**'
      - destination-directory.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate destinations, public wording and JavaScript
        run: |
          node scripts/test-site.mjs
          node scripts/test-departure-geo.mjs
          node scripts/test-search-recovery.mjs
          node scripts/test-application-reference.mjs
          node scripts/test-catalog-shards.mjs
          node scripts/test-country-offer-balance.mjs
          node scripts/test-month-offer-filters.mjs
          node scripts/test-preview-alternatives.mjs
          node scripts/test-visual-selection.mjs
          node scripts/test-strict-public-visual-policy.mjs
          node scripts/test-source-coverage.mjs
          node scripts/test-quote-price-only.mjs
          node scripts/test-hotel-media-feed.mjs
          node scripts/test-commons-hotel-media.mjs
      - name: Verify deployed IP city endpoint before activation
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import './scripts/departure-geo.js';
          const cfg=JSON.parse(fs.readFileSync('departure-geo-config.json','utf8'));
          if(cfg.enabled){
            const endpoint=globalThis.JamaicaDepartureGeo.endpoint(cfg);
            assert.ok(endpoint,'Invalid city endpoint');
            const r=await fetch(endpoint,{headers:{Origin:'https://rosak8-lgtm.github.io'},redirect:'error',signal:AbortSignal.timeout(12000)});
            assert.equal(r.status,200);
            assert.equal(r.headers.get('access-control-allow-origin'),'https://rosak8-lgtm.github.io');
            assert.match(r.headers.get('cache-control')||'',/no-store/);
            const result=await r.json();
            assert.deepEqual(Object.keys(result).sort(),['city','schema','source']);
            assert.equal(result.schema,'jamaica.departure-hint.v1');
            assert.equal(result.source,'IP_APPROXIMATE');
            const choices=[...fs.readFileSync('index.html','utf8').match(/<select id="departure"[^>]*>(.*?)<\/select>/s)[1].matchAll(/<option value="([^"]+)"/g)].map(x=>x[1]);
            assert.ok(result.city===null||choices.includes(result.city));
            console.log('LIVE_IP_CITY_WORKER_HTTP_CORS_PRIVACY_PASS');
          }
          JS
      - name: Validate current public tour feed and multi-country customer path without Node
        run: |
          python3 -B scripts/local_site_qa.py
          python3 -B scripts/site_no_node_qa.py
      - name: Verify server-side quote, booking and payment state machine
        run: python3 -m unittest -v backend.test_order_engine backend.test_contract_first_order_engine backend.test_payment_terms_v45 backend.test_pegas_application_evidence backend.test_pegas_public_projection backend.test_preview_quote_engine backend.test_bg_route_first_visual_gate backend.test_bot_route_source_audit backend.test_bot_visual_sidecar backend.test_trusted_bot_receipt_sink backend.test_v183_bot_contract_inspector backend.test_sqlite_order_repository backend.test_send_booking_notifications backend.test_bg_route_sync backend.test_bg_detail_probe backend.test_bg_preview_export backend.test_bg_selected_quote_probe backend.test_bg_price_age_scope backend.test_bg_private_source_crosswalk backend.test_bg_private_exact_party backend.test_bg_private_quote_bridge backend.test_future_preview_selection backend.test_local_selected_preview backend.test_multicountry_price_scan backend.test_tour_price_reference backend.test_bg_booking_fields_audit backend.test_bg_tour_api_xml backend.test_bg_read_only_price_client backend.test_bg_multiroom_quote backend.test_supplier_sale_policy backend.test_flight_availability_evidence backend.test_oracle_bg_flight_evidence_probe backend.test_oracle_site_publisher backend.test_public_tour_eligibility backend.test_site_bot_price_overlay backend.test_catalog_property_identity backend.test_recent_preview_catalog backend.test_catalog_size_budget backend.test_full_country_discovery backend.test_hotel_reviews backend.test_hotel_enrichment backend.test_bg_hotel_media_candidates backend.test_hbx_licensed_hotel_photos backend.test_hbx_test_probe backend.test_nuitee_sandbox_hotel_probe backend.test_hbx_crosswalk_candidates backend.test_commons_open_hotel_media
      - name: Verify durable multi-origin scheduling without supplier requests
        run: python3 -B -m unittest -v backend.test_bg_origin_queue backend.test_bg_scoped_evidence
      - name: Verify exact Lenovo publisher deployment test order
        run: python3 -B -m unittest -v backend.test_oracle_site_publisher backend.test_bot_visual_sidecar backend.test_trusted_bot_receipt_sink backend.test_site_bot_price_overlay backend.test_bg_preview_export
      - name: Verify customer journey in real Chromium
        run: |
          python3 -m venv /tmp/jamaica-playwright-venv
          /tmp/jamaica-playwright-venv/bin/pip install --disable-pip-version-check playwright==1.55.0
          /tmp/jamaica-playwright-venv/bin/python -m playwright install chromium
          /tmp/jamaica-playwright-venv/bin/python -B scripts/browser_smoke_playwright.py
          /tmp/jamaica-playwright-venv/bin/python -B scripts/test_application_reference_browser.py
      - name: Verify isolated Oracle selected-tour staging imports
        run: bash scripts/test_selected_tour_staging.sh
      - name: Validate safe synchronization scripts
        run: |
          python3 -m py_compile scripts/sync_destination_directory.py scripts/oracle_bg_route_sync.py scripts/probe_price_catalog.py scripts/oracle_bg_price_detail_probe.py scripts/oracle_bg_preview_export.py scripts/oracle_bg_selected_quote_probe.py scripts/select_future_preview.py scripts/local_selected_preview.py backend/test_local_selected_preview.py scripts/oracle_bg_multicountry_price_scan.py scripts/tour_price_reference.py scripts/oracle_bg_booking_fields_audit.py scripts/browser_smoke_playwright.py scripts/site_no_node_qa.py backend/contract_first_order_engine.py backend/preview_quote_engine.py backend/bg_route_first_visual_gate.py backend/test_bg_route_first_visual_gate.py scripts/audit_bot_route_first_from_lenovo.py backend/test_bot_route_source_audit.py scripts/bot_visual_sidecar.py scripts/trusted_bot_receipt_sink.py backend/test_trusted_bot_receipt_sink.py backend/test_bot_visual_sidecar.py scripts/inspect_v183_bot_contract_from_lenovo.py backend/test_v183_bot_contract_inspector.py backend/sqlite_order_repository.py backend/send_booking_notifications.py backend/bg_tour_api_xml.py backend/bg_read_only_price_client.py backend/bg_multiroom_quote.py backend/test_bg_multiroom_quote.py backend/supplier_sale_policy.py backend/test_supplier_sale_policy.py backend/bg_price_age_scope.py backend/test_bg_price_age_scope.py backend/bg_private_source_crosswalk.py backend/test_bg_private_source_crosswalk.py backend/bg_private_exact_party.py backend/test_bg_private_exact_party.py backend/bg_private_quote_bridge.py backend/test_bg_private_quote_bridge.py backend/hotel_reviews_store.py backend/hotel_reviews_api.py backend/moderate_hotel_reviews.py scripts/flight_availability_evidence.py scripts/oracle_bg_flight_evidence_probe.py backend/test_oracle_bg_flight_evidence_probe.py scripts/oracle_site_publisher.py scripts/public_tour_eligibility.py scripts/site_bot_price_overlay.py backend/test_public_tour_eligibility.py backend/test_site_bot_price_overlay.py scripts/catalog_property_identity.py backend/test_catalog_property_identity.py scripts/recent_preview_catalog.py scripts/catalog_size_budget.py backend/test_catalog_size_budget.py backend/test_recent_preview_catalog.py scripts/oracle_bg_hotel_media_candidates.py scripts/hbx_licensed_hotel_photos.py scripts/hbx_test_probe.py scripts/nuitee_sandbox_hotel_probe.py scripts/hbx_crosswalk_candidates.py scripts/commons_open_hotel_media.py scripts/oracle_hbx_media_sync.py
          bash -n scripts/sync_price_routes_from_lenovo.sh scripts/probe_price_details_from_lenovo.sh scripts/sync_tour_previews_from_lenovo.sh scripts/check_selected_tour_from_lenovo.sh scripts/check_country_from_lenovo.sh scripts/test_selected_tour_staging.sh scripts/diagnose_oracle_catalog_from_lenovo.sh scripts/diagnose_live_visual_link_from_lenovo.sh scripts/scan_multicountry_prices_from_lenovo.sh scripts/verify_site_from_lenovo.sh scripts/audit_booking_fields_from_lenovo.sh scripts/check_green_flights_from_lenovo.sh scripts/run_catalog_refresh_locked.sh scripts/install_catalog_refresh_timer.sh scripts/status_catalog_refresh.sh scripts/oracle_install_catalog_timer.sh scripts/deploy_oracle_5min_from_lenovo_once.sh scripts/upgrade_oracle_catalog_on_server_once.sh scripts/oracle_upgrade_country_discovery.sh scripts/oracle_install_hotel_reviews.sh scripts/deploy_oracle_hotel_reviews_from_lenovo_once.sh scripts/install_oracle_hbx_hotel_media_daily.sh
