name: Verify JAMAICA customer site
on:
  push:
    branches: [main]
    paths-ignore:
      - tour-previews.json
      - destination-directory.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate destinations, public wording and JavaScript
        run: node scripts/test-site.mjs
      - name: Validate current public tour feed and multi-country customer path without Node
        run: python3 -B scripts/site_no_node_qa.py
      - name: Verify server-side quote, booking and payment state machine
        run: python3 -m unittest -v backend.test_order_engine backend.test_contract_first_order_engine backend.test_preview_quote_engine backend.test_sqlite_order_repository backend.test_send_booking_notifications backend.test_bg_route_sync backend.test_bg_detail_probe backend.test_bg_preview_export backend.test_bg_selected_quote_probe backend.test_future_preview_selection backend.test_multicountry_price_scan backend.test_tour_price_reference backend.test_bg_booking_fields_audit backend.test_bg_tour_api_xml backend.test_bg_read_only_price_client backend.test_flight_availability_evidence backend.test_oracle_site_publisher backend.test_full_country_discovery backend.test_hotel_reviews
      - name: Verify customer journey in real Chromium
        run: |
          python3 -m venv /tmp/jamaica-playwright-venv
          /tmp/jamaica-playwright-venv/bin/pip install --disable-pip-version-check playwright==1.55.0
          /tmp/jamaica-playwright-venv/bin/python -m playwright install chromium
          /tmp/jamaica-playwright-venv/bin/python -B scripts/browser_smoke_playwright.py
      - name: Validate safe synchronization scripts
        run: |
          python3 -m py_compile scripts/sync_destination_directory.py scripts/oracle_bg_route_sync.py scripts/probe_price_catalog.py scripts/oracle_bg_price_detail_probe.py scripts/oracle_bg_preview_export.py scripts/oracle_bg_selected_quote_probe.py scripts/select_future_preview.py scripts/oracle_bg_multicountry_price_scan.py scripts/tour_price_reference.py scripts/oracle_bg_booking_fields_audit.py scripts/browser_smoke_playwright.py scripts/site_no_node_qa.py backend/contract_first_order_engine.py backend/preview_quote_engine.py backend/sqlite_order_repository.py backend/send_booking_notifications.py backend/bg_tour_api_xml.py backend/bg_read_only_price_client.py backend/hotel_reviews_store.py backend/hotel_reviews_api.py backend/moderate_hotel_reviews.py scripts/flight_availability_evidence.py scripts/oracle_bg_flight_evidence_probe.py scripts/oracle_site_publisher.py
          bash -n scripts/sync_price_routes_from_lenovo.sh scripts/probe_price_details_from_lenovo.sh scripts/sync_tour_previews_from_lenovo.sh scripts/check_selected_tour_from_lenovo.sh scripts/scan_multicountry_prices_from_lenovo.sh scripts/verify_site_from_lenovo.sh scripts/audit_booking_fields_from_lenovo.sh scripts/check_green_flights_from_lenovo.sh scripts/run_catalog_refresh_locked.sh scripts/install_catalog_refresh_timer.sh scripts/status_catalog_refresh.sh scripts/oracle_install_catalog_timer.sh scripts/deploy_oracle_5min_from_lenovo_once.sh scripts/upgrade_oracle_catalog_on_server_once.sh scripts/oracle_upgrade_country_discovery.sh
