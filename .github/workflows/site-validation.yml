name: Verify JAMAICA customer site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate destinations, public wording and JavaScript
        run: node scripts/test-site.mjs
      - name: Verify server-side quote, booking and payment state machine
        run: python3 -m unittest -v backend.test_order_engine backend.test_bg_route_sync
      - name: Validate safe synchronization scripts
        run: |
          python3 -m py_compile scripts/sync_destination_directory.py scripts/oracle_bg_route_sync.py scripts/probe_price_catalog.py
          bash -n scripts/sync_price_routes_from_lenovo.sh
