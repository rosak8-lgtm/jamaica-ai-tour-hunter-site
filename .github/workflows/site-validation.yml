name: Verify JAMAICA customer site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate destinations, public wording and JavaScript
        run: node scripts/test-site.mjs
      - name: Verify server-side quote, booking and payment state machine
        run: python3 -m unittest -v backend.test_order_engine backend.test_bg_route_sync backend.test_bg_detail_probe backend.test_bg_preview_export backend.test_bg_selected_quote_probe backend.test_future_preview_selection backend.test_multicountry_price_scan backend.test_tour_price_reference
      - name: Validate safe synchronization scripts
        run: |
          python3 -m py_compile scripts/sync_destination_directory.py scripts/oracle_bg_route_sync.py scripts/probe_price_catalog.py scripts/oracle_bg_price_detail_probe.py scripts/oracle_bg_preview_export.py scripts/oracle_bg_selected_quote_probe.py scripts/select_future_preview.py scripts/oracle_bg_multicountry_price_scan.py scripts/tour_price_reference.py
          bash -n scripts/sync_price_routes_from_lenovo.sh scripts/probe_price_details_from_lenovo.sh scripts/sync_tour_previews_from_lenovo.sh scripts/check_selected_tour_from_lenovo.sh scripts/scan_multicountry_prices_from_lenovo.sh
