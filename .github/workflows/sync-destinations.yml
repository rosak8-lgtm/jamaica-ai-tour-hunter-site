name: Synchronize JAMAICA destinations and hotels
on:
  push:
    branches: [main]
    paths:
      - scripts/sync_destination_directory.py
      - .github/workflows/sync-destinations.yml
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jamaica-directory-sync
  cancel-in-progress: false
jobs:
  fetch-public-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve and validate public countries, resorts and hotels
        run: python3 scripts/sync_destination_directory.py
      - name: Commit public directory only when it changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add destination-directory.json
          if git diff --cached --quiet; then
            echo "JAMAICA_DIRECTORY_UNCHANGED=YES"
            exit 0
          fi
          git commit -m "Refresh public destination and hotel reference catalog"
          git push origin HEAD:main
